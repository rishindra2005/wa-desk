# cargo-nextest settings. `cargo nextest run --profile ci` is used on GitHub Actions.

[profile.ci]
# Run every test even after a failure, so one CI run reports all of them.
fail-fast = false
# Retry a failed test once; a pass on retry is reported as flaky, not hidden.
retries = 1
# Flag (do not kill) tests that hang past 60 s; kill them after 3 such periods.
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

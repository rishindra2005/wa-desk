name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Libraries Tauri/WebKitGTK need to compile the app crate.
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
    librsvg2-dev libssl-dev patchelf

# The three Linux jobs run in parallel; together they are scripts/check.sh.
jobs:
  lint:
    name: Linux · fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: ${{ env.TAURI_LINUX_DEPS }}
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Linux · Rust tests + bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # Downloading LibreOffice etc. from the runner's default mirror took 40-50 min,
      # so use kernel.org's mirror and cache the .debs. apt-get still installs them,
      # so package setup scripts run (e.g. the libblas alternative ffmpeg needs).
      - name: Restore apt archives
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: ${{ runner.os }}-apt-tests-v2-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-tests-v2-
      - name: System dependencies (Tauri + converter tools used by wa-jobs tests)
        timeout-minutes: 20
        run: |
          sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            $TAURI_LINUX_DEPS ffmpeg ghostscript poppler-utils imagemagick \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          sudo chown -R "$USER" ~/apt-archives
      - name: Save apt archives
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: ${{ runner.os }}-apt-tests-v2-${{ hashFiles('.github/workflows/ci.yml') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests (nextest, ci profile)
        run: cargo nextest run --workspace --profile ci
      - name: Doctests
        run: cargo test --workspace --doc
      - name: TypeScript bindings are up to date
        run: |
          cargo test -p wa-core --quiet >/dev/null
          git diff --exit-code -- app/ui/src/lib/bindings || { echo "::error::bindings out of date; run cargo test -p wa-core and commit"; exit 1; }
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: Linux · UI check, unit, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI dependencies
        working-directory: app/ui
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app/ui
        run: npx playwright install --with-deps chromium
      - name: Playwright system libraries (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: app/ui
        run: npx playwright install-deps chromium
      - name: svelte-check
        working-directory: app/ui
        run: npm run check
      - name: Unit tests (vitest)
        working-directory: app/ui
        run: npm test
      - name: Build
        working-directory: app/ui
        run: npm run build
      - name: E2E (Playwright, mock backend)
        working-directory: app/ui
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/ui/playwright-report
            app/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  bridge:
    name: Bridge (Go) · vet, test, Windows cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/whatsapp-bridge/go.mod
          cache-dependency-path: bridge/whatsapp-bridge/go.sum
      - name: gofmt
        working-directory: bridge/whatsapp-bridge
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: bridge/whatsapp-bridge
        run: go vet ./...
      - name: test
        working-directory: bridge/whatsapp-bridge
        run: go test ./...
      - name: MinGW for the Windows cross-build (cgo, go-sqlite3)
        timeout-minutes: 10
        run: |
          # The runner's default Ubuntu mirror can be very slow; use kernel.org's.
          sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Windows cross-build
        working-directory: bridge/whatsapp-bridge
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -trimpath -ldflags "-s -w" -o /tmp/wa-bridge.exe .

  windows:
    name: Windows · build, clippy, compile tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI build (the app embeds it)
        working-directory: app/ui
        run: |
          npm ci
          npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Many tests still assume Linux (paths, converter tools, SQLite locking);
      # on Windows they are compiled but not run yet.
      - name: Tests (compile only)
        run: cargo test --workspace --no-run

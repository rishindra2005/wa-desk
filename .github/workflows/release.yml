name: Release

# Push a version tag (e.g. `git tag v0.5.0 && git push origin v0.5.0`) to publish a release:
#   1. gate    - the tagged commit must have passed CI (waits for the CI run if it is still going)
#   2. draft   - a draft release whose notes list every change since the previous tag
#   3. build   - Linux (.deb, .AppImage) and Windows (.msi, setup .exe) packages, uploaded to the draft
#   4. publish - SHA256SUMS.txt over all downloads, then the release goes public
# Tags containing "-" (e.g. v0.5.0-rc.1) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.5.0
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  gate:
    name: CI passed for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Wait for the commit's CI run to succeed
        run: |
          sha=$(git rev-parse HEAD)
          echo "Tag $TAG is commit $sha"
          for i in $(seq 1 110); do
            line=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$sha" --limit 1 \
                     --json status,conclusion,url --jq '.[0] | "\(.status) \(.conclusion) \(.url)"' 2>/dev/null || true)
            case "$line" in
              "completed success "*) echo "CI passed: ${line##* }"; exit 0 ;;
              completed*) echo "::error::CI did not pass for $sha: $line"; exit 1 ;;
              "") echo "No CI run for $sha yet (attempt $i)" ;;
              *) echo "CI still running: $line" ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $sha (push the commit to main first so CI runs)"; exit 1

  draft:
    name: Draft release with changelog
    needs: gate
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Release notes
        run: scripts/release-notes.sh "$TAG" "https://github.com/$GITHUB_REPOSITORY" | tee notes.md
      - name: Create (or reuse) the draft release
        id: create
        run: |
          prerelease=false; [[ "$TAG" == *-* ]] && prerelease=true
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -F prerelease=$prerelease \
              -f name="wa-desk $TAG" -F body=@notes.md >/dev/null
            echo "Reusing release $id"
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="wa-desk $TAG" \
                   -F draft=true -F prerelease=$prerelease -F body=@notes.md --jq .id)
            echo "Created draft release $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            os: ubuntu-22.04
            bundles: deb,appimage
            triple: x86_64-unknown-linux-gnu
          - name: Windows (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: true

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's default Ubuntu mirror can be very slow; use kernel.org's.
          sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://mirrors.edge.kernel.org/ubuntu/#g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI dependencies and build
        working-directory: app/ui
        run: |
          npm ci
          npm run build

      # The WhatsApp bridge (Go, cgo for SQLite) ships inside the app as a Tauri sidecar.
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/whatsapp-bridge/go.mod
          cache-dependency-path: bridge/whatsapp-bridge/go.sum
      - name: Build the bundled bridge (sidecar)
        shell: bash
        run: |
          gcc --version | head -1
          scripts/build-bridge.sh ${{ matrix.triple }}
          ls -la app/src-tauri/binaries/

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          # The UI is built above; the release config turns Tauri's own UI build
          # step into a no-op (it ran from the wrong folder under tauri-action).
          args: --bundles ${{ matrix.bundles }} --config ${{ github.workspace }}/app/src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.draft.outputs.release_id }}

  publish:
    name: Checksums and publish
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the uploaded packages
        run: |
          id=${{ needs.draft.outputs.release_id }}
          mkdir dist && cd dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' |
          while read -r aid name; do
            [[ "$name" == SHA256SUMS.txt ]] && continue
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$name"
          done
          ls -la
          count=$(ls | wc -l)
          if [[ "$count" -lt 4 ]]; then echo "::error::expected at least 4 packages, found $count"; exit 1; fi
      - name: SHA256SUMS.txt
        run: |
          cd dist && sha256sum -- * | tee ../SHA256SUMS.txt
      - name: Upload checksums and publish
        run: |
          id=${{ needs.draft.outputs.release_id }}
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[] | select(.name == "SHA256SUMS.txt") | .id')
          [[ -n "$old" ]] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @SHA256SUMS.txt \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=SHA256SUMS.txt" >/dev/null
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false --jq .html_url

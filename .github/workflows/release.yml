name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build the
# Linux (.deb, .AppImage) and Windows (.msi, setup .exe) packages and publish them
# as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb, AppImage)
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows (msi, nsis)
            os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: UI dependencies
        working-directory: app/ui
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.TAG }}
          releaseName: wa-desk ${{ env.TAG }}
          releaseBody: |
            Desktop WhatsApp archive and client (Rust + Tauri v2 + Svelte 5).

            **Downloads**
            - Linux: `.deb` (Ubuntu/Debian) or `.AppImage` (any distro)
            - Windows: `.msi` or `-setup.exe`

            **Requirement:** wa-desk talks to a local WhatsApp bridge (a whatsmeow-based
            service on `127.0.0.1:8080`). Without a bridge running on the same machine the
            app installs and opens but cannot connect to WhatsApp.
          releaseDraft: false
          prerelease: false

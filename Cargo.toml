[workspace]
resolver = "3"
members = [
    "crates/wa-core",
    "crates/wa-db",
    "crates/wa-bridge",
    "crates/wa-jobs",
    "crates/wa-automation",
    "crates/wa-obs",
    "crates/wa-testkit",
    "app/src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
wa-core = { path = "crates/wa-core" }
wa-db = { path = "crates/wa-db" }
wa-bridge = { path = "crates/wa-bridge" }
wa-jobs = { path = "crates/wa-jobs" }
wa-automation = { path = "crates/wa-automation" }
wa-obs = { path = "crates/wa-obs" }
wa-testkit = { path = "crates/wa-testkit" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal"] }
tokio-util = "0.7"
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
regex = "1.11"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3.20"
axum = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
nix = { version = "0.30", features = ["signal", "process"] }
parking_lot = "0.12"
dirs = "6.0"
url = "2.5"
percent-encoding = "2.3"
mime_guess = "2.0"
gtk = "0.18"
# Linux desktop notifications that can be replaced and withdrawn (5.19.0: 2026-08-09).
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
